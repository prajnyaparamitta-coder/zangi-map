# 週1回、載せている動画IDを YouTube Data API で取り直し、ページを書き出し直す。
# 企画書「動画IDの保存期間」：30日の制限に対し、1週間ごとに取り直す（3回続けて飛ばされても28日目に取り直せる）。
name: 動画IDの取り直し

on:
  schedule:
    - cron: "17 3 * * 1"   # 毎週月曜 12時17分（日本時間）。GitHub の混雑で遅れたり飛ばされたりすることがある
  workflow_dispatch:        # Actions の画面から手で動かすこともできる

permissions:
  contents: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 動画IDを取り直す
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/refresh_videos.py
      - name: ページを書き出す
        run: python3 scripts/build.py
      - name: 変わったところを保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json docs
          git diff --cached --quiet || git commit -m "動画IDを取り直した（$(TZ=Asia/Tokyo date +%Y-%m-%d)）"
          git push
