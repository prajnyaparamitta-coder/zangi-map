<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>$page_title</title>
<meta name="description" content="$description">
<meta name="theme-color" content="#294943">
<link rel="stylesheet" href="${root}assets/css/style.css">
$head_extra
</head>
<body class="$body_class">
<a class="skip" href="#main">本文へ移動</a>
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-logo" href="${root}">
      <span class="site-logo__mark" aria-hidden="true"></span>
      <span class="site-logo__name">$site_title</span>
    </a>
    <nav class="site-nav" aria-label="メニュー">
      <a href="${root}" $nav_top>地図</a>
      <a href="${root}areas/" $nav_areas>地域から探す</a>
      <a href="${root}about-zangi/" $nav_zangi>ザンギについて</a>
      <a href="${root}about/" $nav_about>このサイトについて</a>
    </nav>
  </div>
</header>
<main id="main">
$body
</main>
<footer class="site-footer">
  <div class="site-footer__inner">
    <p class="site-footer__name">$site_title</p>
    <p>動画は YouTube の埋め込みプレーヤーで流しています。地図 © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors。出典と連絡先は<a href="${root}about/">このサイトについて</a>に書いています。</p>
  </div>
</footer>
$scripts
</body>
</html>
